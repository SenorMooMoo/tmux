# ==========================================
# CORE OPTIONS & KEYBINDINGS
# ==========================================

# Enable mouse support
set -g mouse on

# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Open splits in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ==========================================
# COPY MODE / VI-MODE
# ==========================================

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# THEME CONFIGURATION (Catppuccin v2)
# ==========================================

# Options must be set BEFORE loading the plugin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# ==========================================
# PLUGINS (TPM)
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Official Catppuccin theme (Removed the dreamsofcode fork conflict)
set -g @plugin 'catppuccin/tmux#v2.3.2'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Fix long pane names
set -g @catppuccin_window_current_text ' #{pane_current_command}'
set -g @catppuccin_window_text ' #{pane_current_command}: #{?#{==:#{pane_current_path},/Users/timothy_wigginton},~,#{?#{m:/Users/timothy_wigginton/*,#{pane_current_path}},~/#{=-20/...:#{s|^/Users/timothy_wigginton/||;s|([^/])[^/]*/|\1/|g:pane_current_path}},#{=-20/...:#{s|([^/])[^/]*/|\1/|g:pane_current_path}}}}'

# Automatic restore tmux on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Load the status modules for Catppuccin v2 style
set -g status-interval 5
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_user}"
